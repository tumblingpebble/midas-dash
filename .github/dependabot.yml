version: 2
updates:
  # Python deps (base + sentiment)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # Keep major migrations separate from routine maintenance batches.
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      python-deps:
        patterns:
          - "*"

  # Frontend deps (React app)
  - package-ecosystem: "npm"
    directory: "/platform_app"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # Keep major migrations separate from routine maintenance batches.
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      npm-deps:
        patterns:
          - "*"
