name: ci

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_DISABLE_ENV_FILE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform_app/package-lock.json

      - name: Build and start synthetic backend
        run: |
          docker compose --env-file /dev/null -p midas-dash-mock -f docker-compose.mock.yml up -d --build --wait --wait-timeout 180 context_api recommender_api gateway_api

      - name: Install and build mock frontend
        working-directory: platform_app
        run: |
          npm ci
          npm run build -- --config vite.mock.config.ts

      - name: Start mock frontend and wait for readiness
        working-directory: platform_app
        run: |
          nohup npm run dev -- --config vite.mock.config.ts > "$RUNNER_TEMP/midas-mock-vite.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/midas-mock-vite.pid"
          for i in $(seq 1 60); do
            if curl --max-time 2 -fsS http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Mock frontend did not become ready"
          exit 1

      - name: Smoke test frontend proxy and synthetic recommendation
        run: node scripts/mock-smoke.mjs --base-url http://127.0.0.1:5173

      - name: Show mock failure logs
        if: failure()
        run: |
          docker compose --env-file /dev/null -p midas-dash-mock -f docker-compose.mock.yml ps
          docker compose --env-file /dev/null -p midas-dash-mock -f docker-compose.mock.yml logs context_api recommender_api gateway_api
          if [ -f "$RUNNER_TEMP/midas-mock-vite.log" ]; then
            cat "$RUNNER_TEMP/midas-mock-vite.log"
          fi

      - name: Tear down mock stack
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/midas-mock-vite.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/midas-mock-vite.pid")" 2>/dev/null || true
          fi
          docker compose --env-file /dev/null -p midas-dash-mock -f docker-compose.mock.yml down -v

  trivy-scan:
    runs-on: ubuntu-latest
    needs: [compose-smoke]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker compose build

      - name: Prepare Trivy cache
        run: |
          mkdir -p .trivycache

      - name: Scan gateway_api image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivycache:/root/.cache/" \
            aquasec/trivy:0.65.0 image \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            midas-dash-gateway_api:latest

      - name: Scan context_api image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivycache:/root/.cache/" \
            aquasec/trivy:0.65.0 image \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            midas-dash-context_api:latest

      - name: Scan recommender_api image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivycache:/root/.cache/" \
            aquasec/trivy:0.65.0 image \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            midas-dash-recommender_api:latest

      - name: Scan sentiment_api image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivycache:/root/.cache/" \
            aquasec/trivy:0.65.0 image \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            midas-dash-sentiment_api:latest

      - name: Scan midas_dash image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivycache:/root/.cache/" \
            aquasec/trivy:0.65.0 image \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            midas-dash-midas_dash:latest

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    runs-on: ubuntu-latest
    needs: [trivy-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker compose build

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOMs
        run: |
          mkdir -p sbom

          syft midas-dash-gateway_api:latest -o cyclonedx-json > sbom/gateway_api.sbom.json
          syft midas-dash-context_api:latest -o cyclonedx-json > sbom/context_api.sbom.json
          syft midas-dash-recommender_api:latest -o cyclonedx-json > sbom/recommender_api.sbom.json
          syft midas-dash-sentiment_api:latest -o cyclonedx-json > sbom/sentiment_api.sbom.json
          syft midas-dash-midas_dash:latest -o cyclonedx-json > sbom/midas_dash_web.sbom.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: midas-dash-sboms
          path: sbom/*.json