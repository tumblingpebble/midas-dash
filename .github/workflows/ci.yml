name: ci

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_DISABLE_ENV_FILE: "1"
  COMPOSE_PARALLEL_LIMIT: "1"

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform_app/package-lock.json

      - name: Classify complete change scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Verify CI scope safeguards
        run: node --test scripts/ci-scope.test.mjs

      - name: Report documentation-only verification
        if: steps.scope.outputs.full == 'false'
        run: echo "Only root README/state changed; image builds and runtime tests are skipped. Secret scanning remains enabled."

      - name: Verify Python dependency locks
        if: steps.scope.outputs.full == 'true'
        run: node scripts/python-locks.mjs --check

      - name: Build and start synthetic backend
        if: steps.scope.outputs.full == 'true'
        run: |
          for service in context_api recommender_api gateway_api; do
            docker compose --env-file /dev/null -p midas-dash-mock -f docker-compose.mock.yml build "$service"
          done
          docker compose --env-file /dev/null -p midas-dash-mock -f docker-compose.mock.yml up -d --no-build --wait --wait-timeout 180 context_api recommender_api gateway_api

      - name: Install and build mock frontend
        if: steps.scope.outputs.full == 'true'
        working-directory: platform_app
        run: |
          npm ci
          npm run build -- --config vite.mock.config.ts

      - name: Start mock frontend and wait for readiness
        if: steps.scope.outputs.full == 'true'
        working-directory: platform_app
        run: |
          nohup npm run dev -- --config vite.mock.config.ts > "$RUNNER_TEMP/midas-mock-vite.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/midas-mock-vite.pid"
          for i in $(seq 1 60); do
            if curl --max-time 2 -fsS http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Mock frontend did not become ready"
          exit 1

      - name: Smoke test frontend proxy and synthetic recommendation
        if: steps.scope.outputs.full == 'true'
        run: node scripts/mock-smoke.mjs --base-url http://127.0.0.1:5173

      - name: Build Compose frontend and validate standalone nginx
        if: steps.scope.outputs.full == 'true'
        run: |
          docker compose --env-file /dev/null -p midas-dash -f docker-compose.yml build midas_dash
          docker run --rm --network none midas-dash-midas_dash:latest nginx -t

      - name: Verify Compose frontend routes and assets
        if: steps.scope.outputs.full == 'true'
        run: |
          docker run -d --name midas-dash-compose-web \
            --network midas-dash-mock_default -p 127.0.0.1:8081:8080 \
            --mount "type=bind,source=$(pwd)/platform_app/nginx.compose.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            midas-dash-midas_dash:latest
          for i in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:8081/healthz > /dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/nginx-smoke.mjs --base-url http://127.0.0.1:8081
          node scripts/mock-smoke.mjs --base-url http://127.0.0.1:8081

      - name: Verify unavailable gateway errors
        if: steps.scope.outputs.full == 'true'
        run: |
          docker run -d --name midas-dash-compose-web-unreachable \
            --add-host gateway_api:127.0.0.1 -p 127.0.0.1:8082:8080 \
            --mount "type=bind,source=$(pwd)/platform_app/nginx.compose.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            midas-dash-midas_dash:latest
          for i in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:8082/ > /dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/nginx-smoke.mjs --base-url http://127.0.0.1:8082 --upstream-down

      - name: Show mock failure logs
        if: failure() && steps.scope.outputs.full == 'true'
        run: |
          docker compose --env-file /dev/null -p midas-dash-mock -f docker-compose.mock.yml ps
          docker compose --env-file /dev/null -p midas-dash-mock -f docker-compose.mock.yml logs context_api recommender_api gateway_api
          docker logs midas-dash-compose-web 2>/dev/null || true
          docker logs midas-dash-compose-web-unreachable 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/midas-mock-vite.log" ]; then
            cat "$RUNNER_TEMP/midas-mock-vite.log"
          fi

      - name: Tear down mock stack
        if: always() && steps.scope.outputs.full == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/midas-mock-vite.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/midas-mock-vite.pid")" 2>/dev/null || true
          fi
          docker rm -f midas-dash-compose-web midas-dash-compose-web-unreachable 2>/dev/null || true
          docker compose --env-file /dev/null -p midas-dash-mock -f docker-compose.mock.yml down -v

  trivy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [compose-smoke]
    steps:
      - uses: actions/checkout@v4
        if: needs.compose-smoke.outputs.full == 'true'
        with:
          lfs: true

      - name: Build images
        if: needs.compose-smoke.outputs.full == 'true'
        run: |
          for service in context_api recommender_api gateway_api sentiment_api midas_dash; do
            docker compose --env-file /dev/null -p midas-dash -f docker-compose.yml build "$service"
          done

      - name: Verify sentiment models offline
        if: needs.compose-smoke.outputs.full == 'true'
        timeout-minutes: 10
        run: |
          docker run --rm -i --network none -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 midas-dash-sentiment_api:latest python - < scripts/sentiment-smoke.py

      - name: Prepare Trivy cache
        if: needs.compose-smoke.outputs.full == 'true'
        run: |
          mkdir -p .trivycache

      - name: Scan gateway_api image
        if: needs.compose-smoke.outputs.full == 'true'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivycache:/root/.cache/" \
            aquasec/trivy:0.65.0 image \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            midas-dash-gateway_api:latest

      - name: Scan context_api image
        if: needs.compose-smoke.outputs.full == 'true'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivycache:/root/.cache/" \
            aquasec/trivy:0.65.0 image \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            midas-dash-context_api:latest

      - name: Scan recommender_api image
        if: needs.compose-smoke.outputs.full == 'true'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivycache:/root/.cache/" \
            aquasec/trivy:0.65.0 image \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            midas-dash-recommender_api:latest

      - name: Scan sentiment_api image
        if: needs.compose-smoke.outputs.full == 'true'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivycache:/root/.cache/" \
            aquasec/trivy:0.65.0 image \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            midas-dash-sentiment_api:latest

      - name: Scan midas_dash image
        if: needs.compose-smoke.outputs.full == 'true'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivycache:/root/.cache/" \
            aquasec/trivy:0.65.0 image \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            midas-dash-midas_dash:latest

      - name: Install Syft
        if: needs.compose-smoke.outputs.full == 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOMs
        if: needs.compose-smoke.outputs.full == 'true'
        run: |
          mkdir -p sbom

          syft midas-dash-gateway_api:latest -o cyclonedx-json > sbom/gateway_api.sbom.json
          syft midas-dash-context_api:latest -o cyclonedx-json > sbom/context_api.sbom.json
          syft midas-dash-recommender_api:latest -o cyclonedx-json > sbom/recommender_api.sbom.json
          syft midas-dash-sentiment_api:latest -o cyclonedx-json > sbom/sentiment_api.sbom.json
          syft midas-dash-midas_dash:latest -o cyclonedx-json > sbom/midas_dash_web.sbom.json

      - name: Upload SBOM artifacts
        if: needs.compose-smoke.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: midas-dash-sboms
          path: sbom/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Report documentation-only verification
        if: needs.compose-smoke.outputs.full == 'false'
        run: echo "Documentation-only change; existing image acceptance is retained and no new images or SBOMs are produced."

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [compose-smoke, trivy-scan]
    steps:
      - uses: actions/setup-node@v4
        if: needs.compose-smoke.outputs.full == 'true'
        with:
          node-version: "22"

      - name: Download SBOMs from the scanned images
        if: needs.compose-smoke.outputs.full == 'true'
        uses: actions/download-artifact@v4
        with:
          name: midas-dash-sboms
          path: sbom

      - name: Verify all five SBOMs
        if: needs.compose-smoke.outputs.full == 'true'
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync } from 'node:fs';
          const names = ['context_api', 'gateway_api', 'recommender_api', 'sentiment_api', 'midas_dash_web'].map(name => `${name}.sbom.json`).sort();
          const files = readdirSync('sbom').sort();
          if (JSON.stringify(files) !== JSON.stringify(names)) throw new Error('Expected exactly five SBOM files');
          for (const file of files) {
            const bom = JSON.parse(readFileSync(`sbom/${file}`, 'utf8'));
            if (bom.bomFormat !== 'CycloneDX' || !Array.isArray(bom.components) || !bom.components.length) throw new Error(`Invalid SBOM: ${file}`);
          }
          console.log('Verified five CycloneDX SBOMs from the scanned images');
          JS

      - name: Report documentation-only verification
        if: needs.compose-smoke.outputs.full == 'false'
        run: echo "Documentation-only change; no new SBOM artifact is expected."
